name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_DEBUG: "False"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      DJANGO_SECURE_HSTS_PRELOAD: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-at-least-fifty-characters-123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt pip-audit
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip_audit --requirement requirements.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - name: Run tests
        run: python manage.py test
      - name: Run deployment checks
        run: python manage.py check --deploy --fail-level WARNING
