{% extends 'pessoas/base.html' %}
{% block content %}
  <div class="glass-panel p-4 p-md-5 text-center">
    <h1 class="display-6">Sair</h1>
    <p class="lead text-white-50 mb-4">Encerre sua sessão para proteger os dados cadastrados.</p>
    <form method="post" action="{% url 'logout' %}" class="d-flex justify-content-center gap-2">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">
        <i class="bi bi-box-arrow-right me-1"></i>Encerrar sessão
      </button>
      <a class="btn btn-outline-light" href="{% url 'pessoas:dashboard' %}">
        <i class="bi bi-house-door me-1"></i>Cancelar
      </a>
    </form>
  </div>
{% endblock %}
